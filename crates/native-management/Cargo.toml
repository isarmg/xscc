[package]
name = "xscc-native-management"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[dependencies]
async-trait = "0.1.92"
hex = "0.4"
hmac = "0.13"
libc = "0.2"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "~1.53.2", features = ["sync", "time", "fs", "rt", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
xscc = { path = "../management" }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
