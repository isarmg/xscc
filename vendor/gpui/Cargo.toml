[workspace]
resolver = "2"
members = [
    "crates/bench_metrics",
    "crates/collections",
    "crates/gpui",
    "crates/gpui_apple",
    "crates/gpui_android",
    "crates/gpui_ios",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_util",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/http_client",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/zlog",
    "crates/ztracing",
    "crates/ztracing_macro",
]
default-members = ["crates/gpui", "crates/gpui_platform"]

[workspace.package]
