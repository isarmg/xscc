name: Rust virtual display driver
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test display profiles and signal timing
        run: cargo test --locked --offline --manifest-path drivers/virtual-display/Cargo.toml
  unsigned-driver:
    needs: cpu
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up fixed NuGet CLI
        uses: NuGet/setup-nuget@323ab0502cd38fdc493335025a96c8fdb0edc71f
        with:
          nuget-version: '6.11.1'
      - name: Compile and validate unsigned UMDF package
        shell: pwsh
        run: ./.github/scripts/build-virtual-display-driver.ps1
      - name: Retain unsigned package and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: virtual-display-driver-x64-UNSIGNED-${{ github.sha }}
          path: artifacts/virtual-display-driver/
          if-no-files-found: error
          retention-days: 7
