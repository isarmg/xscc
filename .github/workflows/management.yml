name: Native management
on:
  push:
    branches: [main, feat/management-prep]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
      - name: Validate workspace layout
        shell: bash
        run: |
          cargo metadata --no-deps --locked --offline --format-version 1 > "$RUNNER_TEMP/xscc-metadata.json"
          python3 - <<'PY_LAYOUT'
          import json, os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'xscc-metadata.json').read_text())
          root = Path(metadata['workspace_root']).resolve()
          application = next(p for p in metadata['packages'] if p['name'] == 'rustdesk')
          management = next(p for p in metadata['packages'] if p['name'] == 'xscc')
          dependency = next(d for d in application['dependencies'] if d['name'] == 'xscc')
          assert Path(application['manifest_path']).resolve() == root / 'Cargo.toml'
          assert Path(management['manifest_path']).resolve() == root / 'crates/management/Cargo.toml'
          assert Path(dependency['path']).resolve() == root / 'crates/management'
          assert dependency['source'] is None
          assert management['id'] in metadata['workspace_members']
          PY_LAYOUT
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
          components: rustfmt,clippy
      - run: cargo fmt -p xscc -p xscc-native-management -- --check
      - run: cargo clippy --locked -p xscc -p xscc-native-management --all-targets -- -D warnings
      - run: cargo test --locked -p xscc -p xscc-native-management
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: aarch64-linux-android
          - os: macos-26
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: clippy
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        if: matrix.target == 'aarch64-linux-android'
        id: ndk
        with:
          ndk-version: r30
      - name: Configure Android C compiler
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          echo "CC_aarch64_linux_android=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo clippy --locked -p xscc -p xscc-native-management --target ${{ matrix.target }} --all-targets -- -D warnings
