name: Flutter mobile beta candidates
on:
  push:
    branches: [feat/management-prep]
    paths:
      - 'flutter/**'
      - 'src/**'
      - 'libs/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vcpkg.json'
      - 'res/vcpkg*/**'
      - 'packaging/mobile/**'
      - '.github/workflows/bridge.yml'
      - '.github/workflows/mobile-beta.yml'
      - '.github/workflows/ios-beta.yml'
      - '.github/scripts/*mobile*'
      - '.github/scripts/*ios*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-beta-${{ github.ref }}
  cancel-in-progress: false
env:
  RUST_VERSION: '1.99.0'
  ANDROID_FLUTTER_VERSION: '3.47.7'
  CARGO_NDK_VERSION: '4.1.2'
  NDK_VERSION: r30
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  ios:
    needs: [generate-bridge]
    uses: ./.github/workflows/ios-beta.yml
  android:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check candidate source and mobile authorization contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/test-mobile-managed-login.py

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Prepare local native dependency cache
        run: mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"

      - name: Setup pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Install vcpkg dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android # TODO: drop '-android' part after caches are invalidated
          key: aarch64-linux-android

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '27'

      - name: Build debug-key signed Android test candidate
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ORG_GRADLE_PROJECT_xsccBeta: 'true'
        run: |
          set -euo pipefail
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/
          cd flutter
          flutter build apk --release --target-platform android-arm64

      - name: Verify and package Android candidate
        run: |
          set -euo pipefail
          APK=flutter/build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/mobile-apk-badging.txt
          grep -q "package: name='org.sarmg.xscc.beta'" /tmp/mobile-apk-badging.txt
          grep -q "^sdkVersion:'29'$" /tmp/mobile-apk-badging.txt
          grep -q "^native-code: 'arm64-v8a'$" /tmp/mobile-apk-badging.txt
          python3 -c 'import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); assert z.getinfo("lib/arm64-v8a/librustdesk.so").file_size > 0' "$APK"
          mkdir -p dist/android
          cp "$APK" "dist/android/xscc-android-arm64-debug-key-${GITHUB_SHA:0:12}.apk"
          cp packaging/mobile/README.md dist/android/README.md
          printf 'commit=%s\nplatform=android-arm64\nmin_sdk=29\nui=Flutter\nmode=managed-client-only\nsigning=ephemeral-debug-key\nrelease_optimized=true\ndevice_test=not-run\n' "$GITHUB_SHA" > dist/android/BUILD-INFO.txt
          (cd dist/android && sha256sum *.apk > SHA256SUMS)

      - name: Upload installable Android test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xscc-android-arm64-debug-key-${{ github.sha }}
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
