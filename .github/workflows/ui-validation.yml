name: GPUI framework validation
on:
  push:
    branches: [main, feat/management-prep]
    paths: ["apps/**", "experiments/**", "src/**", "libs/**", "crates/**", "vendor/gpui/**", "libs/hardware-video-codecs/**", "build.rs", "Cargo.toml", "Cargo.lock", "vcpkg.json", "res/vcpkg*/**", "res/native-*", "res/native-package-build/**", ".github/workflows/ui-validation.yml"]
  pull_request:
    paths: ["apps/**", "experiments/**", "src/**", "libs/**", "crates/**", "vendor/gpui/**", "libs/hardware-video-codecs/**", "build.rs", "Cargo.toml", "Cargo.lock", "vcpkg.json", "res/vcpkg*/**", "res/native-*", "res/native-package-build/**", ".github/workflows/ui-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        framework: [gpui]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ui-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
          components: rustfmt,clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libvulkan-dev libasound2-dev libclang-dev mesa-vulkan-drivers nasm ninja-build pkg-config
      - name: Formatting
        run: cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check
      - name: Compile and lint actual prototype
        run: cargo clippy --locked --no-deps --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings
      - name: Shared native UI tests
        run: cargo test --locked -p xscc-native-ui
      - name: Wayland frame lifecycle unit regressions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output=$(cargo test --locked --manifest-path vendor/gpui/Cargo.toml -p gpui_linux --lib linux::wayland:: -- --test-threads=1 2>&1) || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' <<< "$output" || { echo 'Wayland frame and client regressions did not run' >&2; exit 1; }
      - name: Wire input tests
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml
      - name: Build executable
        run: cargo build --locked --manifest-path apps/desktop/Cargo.toml
      - name: Set up repository native codec build
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/setup-pinned-vcpkg.py --root "$RUNNER_TEMP/xscc-vcpkg"
      - name: Linux software codec build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-no-default-features --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --manifest-path apps/desktop/Cargo.toml --features xscc-codec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.framework }}-${{ matrix.os }}
          path: |
            target/ui-validation/debug/xscc-desktop
            target/ui-validation/debug/xscc-desktop.exe
          if-no-files-found: error
