name: One-KVM bare-metal Web host
on:
  push:
    branches: [main, feat/management-prep]
    paths: ['one-kvm/**', 'Cargo.toml', '.github/workflows/one-kvm-native.yml']
  pull_request:
    paths: ['one-kvm/**', 'Cargo.toml', '.github/workflows/one-kvm-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: one-kvm-native-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: one-kvm
env:
  CARGO_TERM_COLOR: always
jobs:
  frontend-and-management:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Validate native package contents
        run: python3 build/test-native-packaging.py
      - name: Check host formatting and management contracts
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path crates/management/Cargo.toml --all -- --check
          cargo test --locked --manifest-path crates/management/Cargo.toml --workspace -- --test-threads=2
          cargo clippy --locked --manifest-path crates/management/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Check and build the Rust browser application
        run: |
          cargo fmt --manifest-path web/xcss-web/Cargo.toml -- --check
          cargo test --locked --manifest-path web/xcss-web/Cargo.toml --lib
          cargo clippy --locked --manifest-path web/xcss-web/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo run --locked --manifest-path tools/web-build/Cargo.toml -- build --product-root .
      - uses: actions/upload-artifact@v4
        with:
          name: one-kvm-web-dist
          path: one-kvm/web/dist
          if-no-files-found: error
          retention-days: 7
  linux:
    runs-on: ubuntu-24.04
    needs: frontend-and-management
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: one-kvm-web-dist
          path: one-kvm/web/dist
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
      - name: Install cross-compilation build tool
        run: cargo install cross --version 0.2.5 --locked
      - name: Test native host logic in the x86_64 build environment
        run: cross test --locked --lib --target x86_64-unknown-linux-gnu
      - name: Build native Linux binaries and Debian packages
        run: |
          bash build/build-images.sh
          bash build/package-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: one-kvm-linux-deb
          path: one-kvm/target/debian/*.deb
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-2022
    needs: frontend-and-management
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: one-kvm-web-dist
          path: one-kvm/web/dist
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare repository-pinned native libraries
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:RUNNER_TEMP "one-kvm-vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          $env:VCPKG_INSTALLED_DIR = Join-Path $pwd "vcpkg_installed"
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          git -C $env:VCPKG_ROOT checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw "vcpkg pinned revision unavailable" }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET --x-install-root="$env:VCPKG_INSTALLED_DIR"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg manifest dependencies failed" }
          $tripletRoot = Join-Path $env:VCPKG_INSTALLED_DIR $env:VCPKG_DEFAULT_TRIPLET
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" | Out-File $env:GITHUB_ENV -Append
          "VCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" | Out-File $env:GITHUB_ENV -Append
          "TURBOJPEG_SOURCE=explicit" | Out-File $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$(Join-Path $tripletRoot 'lib')" | Out-File $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$(Join-Path $tripletRoot 'include')" | Out-File $env:GITHUB_ENV -Append
      - name: Test and lint Windows host logic
        shell: pwsh
        run: |
          cargo test --locked --lib --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Windows host tests failed" }
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Windows host lint failed" }
      - name: Build and package Windows Web host
        shell: pwsh
        run: .\build\windows\build.ps1 -Configuration release -Package
      - name: Validate executable and startup script syntax
        shell: pwsh
        run: |
          & .\target\x86_64-pc-windows-msvc\release\one-kvm.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Windows host help failed" }
          Get-ChildItem build/windows/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $parseTokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: one-kvm-windows-native
          path: |
            one-kvm/target/native-windows/*.zip
            one-kvm/target/native-windows/*.sha256
          if-no-files-found: error
          retention-days: 7
