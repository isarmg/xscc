name: GPUI Android native candidates
on:
  push:
    branches: [main, feat/management-prep]
    paths:
      - 'experiments/gpui-android-smoke/**'
      - 'experiments/gpui-mobile-management/**'
      - 'experiments/gpui-validation/src/dashboard.rs'
      - 'experiments/gpui-validation/src/text_field.rs'
      - 'experiments/gpui-validation/src/theme.rs'
      - 'crates/management/**'
      - 'crates/native-management/**'
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vcpkg.json'
      - 'res/vcpkg*/**'
      - 'vendor/gpui/**'
      - 'packaging/gpui-android/**'
      - '.github/workflows/gpui-android-smoke.yml'
      - '.github/scripts/*gpui-android*'
      - '.github/scripts/*gpui-game-activity*'
      - '.github/scripts/*gpui*mobile*'
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build and package without additional host-side tests'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gpui-android-smoke-${{ github.ref }}
  cancel-in-progress: false
env:
  RUST_VERSION: '1.99.0'
  CARGO_NDK_VERSION: '4.1.2'
  NDK_VERSION: r30
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
  GRADLE_VERSION: '9.8.1'
  GRADLE_SHA256: dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: smoke
            variant: Smoke
            workspace: experiments/gpui-android-smoke
            library: xscc_gpui_android_smoke
            package: org.xscc.gpui.smoke
            permission_mode: smoke
          - flavor: management
            variant: Management
            workspace: experiments/gpui-mobile-management
            library: xscc_gpui_android_management
            package: org.sarmg.xscc.gpui.preview
            permission_mode: management
    env:
      FLAVOR: ${{ matrix.flavor }}
      VARIANT: ${{ matrix.variant }}
      WORKSPACE: ${{ matrix.workspace }}
      NATIVE_LIBRARY: ${{ matrix.library }}
      APPLICATION_ID: ${{ matrix.package }}
      PERMISSION_MODE: ${{ matrix.permission_mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check source and package validation tests
        if: ${{ !inputs.build_only }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/test-gpui-mobile-test-gate.py
          python3 .github/scripts/test-gpui-android-apk.py
          python3 .github/scripts/test-gpui-android-privacy.py
          python3 .github/scripts/test-gpui-game-activity.py

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Prepare management codec build tools
        if: matrix.flavor != 'smoke'
        run: |
          sudo apt-get install -y nasm
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"

      - name: Setup pinned management codec dependencies
        if: matrix.flavor != 'smoke'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Restore native dependency binary archives
        if: matrix.flavor != 'smoke'
        id: native-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: mobile-vcpkg-Linux-arm64-android-${{ env.NDK_VERSION }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}

      - name: Build Android native codec dependencies
        if: matrix.flavor != 'smoke'
        id: native-dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash .github/scripts/build-gpui-android-native-deps.sh arm64-v8a

      - name: Save successful native dependency binary archives
        if: matrix.flavor != 'smoke' && steps.native-dependencies.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Test GPUI Android geometry on the host
        if: ${{ !inputs.build_only }}
        run: |
          rustc --edition 2024 --test vendor/gpui/crates/gpui_android/src/geometry.rs -o "$RUNNER_TEMP/gpui-android-geometry-tests"
          "$RUNNER_TEMP/gpui-android-geometry-tests"
          rustc --edition 2024 --test vendor/gpui/crates/gpui_android/src/text_state.rs -o "$RUNNER_TEMP/gpui-android-text-state-tests"
          "$RUNNER_TEMP/gpui-android-text-state-tests"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ${{ matrix.workspace }}
          prefix-key: gpui-android-${{ matrix.flavor }}-r30
          cache-on-failure: true

      - name: Test mobile enrollment input against the shared protocol
        if: ${{ !inputs.build_only }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/${{ matrix.workspace }}/target
          CARGO_BUILD_JOBS: '4'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked -p xscc-native-management --test mobile_enrollment_input

      - name: Cross-compile the selected GPUI library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384'
        run: |
          set -euo pipefail
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          JNI_LIBS="$GITHUB_WORKSPACE/packaging/gpui-android/app/src/$FLAVOR/jniLibs"
          mkdir -p "$JNI_LIBS"
          cd "$WORKSPACE"
          FEATURES=()
          if [ "$FLAVOR" != smoke ]; then
            FEATURES=(--no-default-features --features mobile-management,mobile-session)
            if [ "$FLAVOR" = landirect ]; then FEATURES=(--no-default-features --features mobile-management,mobile-session,test-lan-direct); fi
            cargo tree --locked --target aarch64-linux-android "${FEATURES[@]}" --edges normal --prefix none --format '{p}|{f}' > "$RUNNER_TEMP/management-dependencies.txt"
            python3 - "$RUNNER_TEMP/management-dependencies.txt" <<'PY'
          import os, sys
          graph = {}
          for line in open(sys.argv[1]):
              package, features = line.rstrip().split('|', 1)
              graph.setdefault(package.split()[0], set()).update(filter(None, features.removesuffix(' (*)').split(',')))
          assert {'rustdesk', 'scrap'} <= graph.keys(), "Missing real native-video client"
          assert not ({'flutter_rust_bridge', 'flutter_rust_bridge_macros', 'dart-sys', 'enigo', 'clipboard', 'hwcodec'} & graph.keys()), "Unexpected Flutter/host/FFmpeg dependency"
          assert {'gpui-mobile-session', 'managed', 'mediacodec'} <= graph['rustdesk'], "Missing managed mobile MediaCodec boundary"
          assert not ({'default', 'flutter', 'gpui-host', 'hwcodec', 'vram', 'drm', 'screencapturekit'} & graph['rustdesk']), "Unexpected root capabilities"
          assert ('test-lan-direct' in graph['rustdesk']) == (os.environ['FLAVOR'] == 'landirect'), "Test-only capability mismatch"
          assert 'mediacodec' in graph['scrap'], "Missing native Android hardware decoder"
          assert not ({'capture', 'wayland', 'drm', 'hwcodec', 'vram', 'quartz', 'x11'} & graph['scrap']), "Unexpected scrap capture/FFmpeg capability"
          PY
          fi
          if [ "$FLAVOR" != smoke ]; then
            bindgen_args="$(cargo ndk-env --platform 29 --target aarch64-linux-android --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android"])')"
            env "BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android=$bindgen_args --target=aarch64-linux-android29" \
              cargo ndk -t arm64-v8a --platform 29 -o "$JNI_LIBS" build --lib --release --locked "${FEATURES[@]}"
          else
            cargo ndk -t arm64-v8a --platform 29 -o "$JNI_LIBS" build --lib --release --locked
          fi
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI_LIBS/arm64-v8a/"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '27'

      - name: Test Java IME generation and single-line editor actions on the host
        if: ${{ !inputs.build_only }}
        run: |
          python3 .github/scripts/test-gpui-android-ime.py
          python3 .github/scripts/test-gpui-android-editor-action.py

      - name: Install pinned Gradle and Android SDK components
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare stable management-preview signature
        if: matrix.flavor == 'management'
        env:
          XSCC_PREVIEW_KEYSTORE_B64: ${{ secrets.XSCC_ANDROID_PREVIEW_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$XSCC_PREVIEW_KEYSTORE_B64"
          umask 077
          printf '%s' "$XSCC_PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/xscc-preview.jks"

      - name: Assemble optimized release APK
        env:
          XSCC_ANDROID_PREVIEW_PASSWORD: ${{ secrets.XSCC_ANDROID_PREVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$FLAVOR" = management ]; then
            test -n "$XSCC_ANDROID_PREVIEW_PASSWORD"
            export XSCC_ANDROID_PREVIEW_KEYSTORE="$RUNNER_TEMP/xscc-preview.jks"
          fi
          gradle --no-daemon -p packaging/gpui-android :app:assemble${VARIANT}Release

      - name: Verify actual APK and package evidence
        id: verify-apk
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          APK="packaging/gpui-android/app/build/outputs/apk/$FLAVOR/release/app-$FLAVOR-release.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist/gpui-android
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/gpui-android/signature.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > dist/gpui-android/zip-alignment.txt
          "$TOOLS/aapt" dump badging "$APK" | tee dist/gpui-android/manifest-badging.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > dist/gpui-android/manifest-tree.txt
          grep -q "launchable-activity: name='org.xscc.gpui.smoke.SmokeActivity'" dist/gpui-android/manifest-badging.txt
          test_args=()
          if [ "$FLAVOR" = landirect ]; then test_args+=(--test-lan-direct); fi
          python3 .github/scripts/verify-gpui-android-apk.py "$APK" --expected-package "$APPLICATION_ID" --expected-library "$NATIVE_LIBRARY" --permission-mode "$PERMISSION_MODE" "${test_args[@]}" --badging dist/gpui-android/manifest-badging.txt --manifest-tree dist/gpui-android/manifest-tree.txt | tee dist/gpui-android/native-validation.txt
          unzip -p "$APK" "lib/arm64-v8a/lib$NATIVE_LIBRARY.so" > "$RUNNER_TEMP/gpui-smoke.so"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" --dynamic --defined-only "$RUNNER_TEMP/gpui-smoke.so" > "$RUNNER_TEMP/gpui-symbols.txt"
          grep -Eq ' T Java_org_xscc_gpui_AndroidImeBridge_nativeTextChanged$' "$RUNNER_TEMP/gpui-symbols.txt"
          grep -Eq ' T Java_org_xscc_gpui_AndroidImeBridge_nativeAction$' "$RUNNER_TEMP/gpui-symbols.txt"
          mapfile -t GAME_AARS < <(find "$HOME/.gradle/caches/modules-2/files-2.1/androidx.games/games-activity/4.4.0" -name '*.aar')
          test "${#GAME_AARS[@]}" -eq 1
          privacy_args=()
          if [ "$FLAVOR" != smoke ]; then privacy_args+=(--management); fi
          python3 .github/scripts/verify-gpui-android-privacy.py "$APK" "${GAME_AARS[0]}" "${privacy_args[@]}" | tee dist/gpui-android/dex-privacy.txt
          cp "$APK" "dist/gpui-android/xscc-gpui-android-arm64-$FLAVOR-${GITHUB_SHA:0:12}.apk"
          cp packaging/gpui-android/README.md dist/gpui-android/
          cp "$GITHUB_WORKSPACE/Cargo.lock" dist/gpui-android/
          scope="$FLAVOR-preview"
          signing=disposable-debug-key
          if [ "$FLAVOR" = management ]; then signing=repository-preview-key; fi
          if [ "$FLAVOR" != smoke ]; then scope=software-video-pointer-keyboard-audio-preview; fi
          printf 'commit=%s\nui=GPUI\nscope=%s\nmin_sdk=29\ntarget_sdk=36\nabi=arm64-v8a\nsigning=%s\ndevice_test=not-run\n' "$GITHUB_SHA" "$scope" "$signing"             > dist/gpui-android/BUILD-INFO.txt
          if [ "$FLAVOR" != smoke ]; then
            printf 'session=software-video-pointer-keyboard-audio-preview\ninput_modes=direct-control,view-only\nkeyboard=true\nkeyboard_scope=software-keyboard-text-and-control-keys\nfull_hardware_keyboard=false\nhardware_control_compatibility=unmodified-nonrepeating-enter-tab\nwayland_non_ascii=rejected\naudio=true\naudio_default_enabled=false\naudio_mode=foreground-playback-only-explicit-per-session-opt-in\nmicrophone=false\nclipboard=false\nlocal_field_paste=explicit-foreground-text-only\nfirst_frame_test=not-run\nkeyboard_device_test=not-run\naudio_device_test=not-run\n' >> dist/gpui-android/BUILD-INFO.txt
            cp "$RUNNER_TEMP/management-dependencies.txt" dist/gpui-android/
          fi
          if [ "$FLAVOR" = landirect ]; then
            python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from gpui_mobile_test_gate import WARNING; print(WARNING)" > dist/gpui-android/TEST-ONLY.txt
            printf 'test_lan_direct=true\nidentity_authentication=false\nhost_test_opt_in_required=true\ntest_ip_scope=any-reachable-ipv4-or-ipv6\n' >> dist/gpui-android/BUILD-INFO.txt
            mv "dist/gpui-android/xscc-gpui-android-arm64-$FLAVOR-${GITHUB_SHA:0:12}.apk" "dist/gpui-android/xscc-gpui-android-arm64-TEST-IP-direct-${GITHUB_SHA:0:12}.apk"
          else
            printf 'test_lan_direct=false\n' >> dist/gpui-android/BUILD-INFO.txt
          fi
          (cd dist/gpui-android && sha256sum *.apk Cargo.lock > SHA256SUMS)

      - name: Collect failed DEX privacy diagnostics (no installable APK)
        if: failure() && steps.verify-apk.outcome == 'failure'
        run: |
          set -euo pipefail
          APK="packaging/gpui-android/app/build/outputs/apk/$FLAVOR/release/app-$FLAVOR-release.apk"
          mkdir -p diagnostics/gpui-android
          unzip -j "$APK" 'classes*.dex' -d diagnostics/gpui-android
          for dex in diagnostics/gpui-android/classes*.dex; do
            "$ANDROID_HOME/build-tools/36.0.0/dexdump" -d "$dex" > "$dex.disassembly.txt"
          done
          cp packaging/gpui-android/app/build/outputs/mapping/${FLAVOR}Release/configuration.txt diagnostics/gpui-android/
          cp packaging/gpui-android/app/build/outputs/mapping/${FLAVOR}Release/mapping.txt diagnostics/gpui-android/
          printf 'commit=%s\npurpose=failed-privacy-gate-diagnostics-only\n' "$GITHUB_SHA" > diagnostics/gpui-android/BUILD-INFO.txt

      - name: Upload failed DEX diagnostics only
        if: failure() && steps.verify-apk.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpui-android-${{ matrix.flavor }}-failed-dex-diagnostics-${{ github.sha }}
          path: diagnostics/gpui-android/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xscc-gpui-android-${{ matrix.flavor }}-${{ github.sha }}
          path: dist/gpui-android/*
          if-no-files-found: error
          retention-days: 14
