name: Windows texture bridge WARP probe
on:
  push:
    branches: [feat/management-prep]
    paths:
      - 'experiments/windows-texture-bridge/**'
      - '.github/workflows/windows-texture-bridge.yml'
permissions:
  contents: read
jobs:
  warp-api:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: experiments/windows-texture-bridge
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-texture-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt,clippy
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint standalone Windows probe
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Test pixel verification helpers
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build standalone probe
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify WARP API interoperability (not physical GPU or GPUI display)
        timeout-minutes: 2
        run: |
          Write-Host 'WARP software-only D3D11 API/pixel verification. This does not validate physical GPU decoding, GPUI display, presentation, or zero-copy.'
          & "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/xscc-windows-texture-bridge.exe" --warp
          if ($LASTEXITCODE -ne 0) { throw "WARP probe failed with exit code $LASTEXITCODE" }
