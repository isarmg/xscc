name: GPUI source and package checks
on:
  push:
    branches: [main, feat/management-prep]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate native GPUI workflow boundary
        run: python3 .github/scripts/check-gpui-workflows.py
      - name: Test GPUI package and release contracts
        run: |
          python3 .github/scripts/test-gpui-vendored-source.py
          python3 .github/scripts/test-gpui-package-mode.py
          python3 .github/scripts/test-gpui-ios-package.py
          python3 .github/scripts/test-gpui-macos-package.py
          python3 .github/scripts/test-gpui-release.py
