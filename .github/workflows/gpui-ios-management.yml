name: GPUI iOS interactive playback preview
on:
  workflow_dispatch:
  push:
    branches: [feat/management-prep]
    paths:
      - 'experiments/gpui-mobile-management/**'
      - 'experiments/shared/**'
      - 'experiments/gpui-validation/src/text_field.rs'
      - 'experiments/gpui-validation/src/theme.rs'
      - 'vendor/gpui/**'
      - 'crates/**'
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vcpkg.json'
      - 'res/vcpkg/**'
      - 'res/vcpkg-triplets/**'
      - 'packaging/gpui-ios/**'
      - '.github/scripts/*gpui-ios*'
      - '.github/scripts/*gpui*mobile*'
      - '.github/workflows/gpui-ios-management.yml'
permissions:
  contents: read
concurrency:
  group: gpui-ios-management-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device-preview:
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: interactive-playback-preview
            features: mobile-session
            package_flags: --playback-preview
    env:
      VCPKG_DEFAULT_TRIPLET: arm64-ios
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-ios
          components: rustfmt, clippy
      - name: Verify source and device SDK
        id: apple
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo "sdk=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/test-gpui-ios-package.py
          python3 .github/scripts/test-gpui-mobile-test-gate.py
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
          brew install nasm
      - name: Read-only simulator capability probe (not app acceptance)
        continue-on-error: true
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess

          def probe(args, decode=False):
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=30)
                  if result.returncode:
                      return {'status': 'not_available', 'detail': result.stderr.strip()}
                  value = json.loads(result.stdout) if decode else result.stdout.strip()
                  return {'status': 'available', 'value': value}
              except (OSError, subprocess.TimeoutExpired, ValueError) as error:
                  return {'status': 'probe_error', 'detail': str(error)}

          swift = ('import Foundation; import Metal; '
                   'let devices = MTLCopyAllDevices(); '
                   'let report: [String: Any] = ["default_device_available": '
                   'MTLCreateSystemDefaultDevice() != nil, "devices": devices.map { $0.name }]; '
                   'let data = try JSONSerialization.data(withJSONObject: report); '
                   'print(String(decoding: data, as: UTF8.self))')
          report = {
              'purpose': 'Environment evidence only; no simulator app was built, installed or tested',
              'simulator_sdk': probe(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version']),
              'runtimes': probe(['xcrun', 'simctl', 'list', 'runtimes', '-j'], True),
              'devices': probe(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], True),
              'host_metal': probe(['xcrun', 'swift', '-e', swift], True),
          }
          runtimes = report['runtimes'].get('value', {}).get('runtimes', [])
          report['ios26_runtime'] = 'available' if any(
              r.get('isAvailable') and r.get('version', '').split('.')[0] == '26'
              and '.iOS-' in r.get('identifier', '') for r in runtimes) else 'not_available'
          if report['host_metal'].get('value', {}).get('default_device_available') is False:
              report['host_metal']['status'] = 'not_available'
          rendered = json.dumps(report, indent=2, ensure_ascii=False)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Simulator capability preflight (not app acceptance)\n'
                            'Host Metal availability does not prove simulator rendering.\n'
                            '```json\n' + rendered + '\n```\n')
          PYTHON
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            experiments/gpui-mobile-management
            vendor/gpui
          key: gpui-ios26-${{ steps.apple.outputs.xcode }}-${{ steps.apple.outputs.sdk }}
          cache-on-failure: true
      - name: Check formatting and host management and keyboard tests
        working-directory: experiments/gpui-mobile-management
        run: |
          cargo fmt --check
          cargo test --locked --bin xscc-gpui-mobile-management
      - name: Run GPUI raw touch regression tests
        working-directory: vendor/gpui
        run: |
          set -o pipefail
          cargo test --locked -p gpui --lib raw_touch_ 2>&1 | tee "$RUNNER_TEMP/gpui-raw-touch-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/gpui-raw-touch-tests.log"
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true
      - name: Restore native dependency binary archives
        id: native-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: mobile-vcpkg-macOS-arm64-ios-${{ steps.apple.outputs.xcode }}-${{ steps.apple.outputs.sdk }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}
      - name: Build native codec dependencies
        id: native-dependencies
        run: '"$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --overlay-triplets="$GITHUB_WORKSPACE/res/vcpkg-triplets" --x-install-root="$VCPKG_ROOT/installed"'
      - name: Save successful native dependency binary archives
        if: steps.native-dependencies.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Check and build native device application
        working-directory: experiments/gpui-mobile-management
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '26.0'
        run: |
          test "$(rustc --print deployment-target --target aarch64-apple-ios)" = 'IPHONEOS_DEPLOYMENT_TARGET=26.0'
          cargo check --locked --target aarch64-apple-ios --features "${{ matrix.features }}" --bin xscc-gpui-mobile-management
          cargo check --tests --locked --target aarch64-apple-ios --features "${{ matrix.features }}"
          cargo clippy --locked --target aarch64-apple-ios --features "${{ matrix.features }}" --bin xscc-gpui-mobile-management
          cargo build --locked --release --target aarch64-apple-ios --features "${{ matrix.features }}" --bin xscc-gpui-mobile-management
      - name: Validate and package unsigned preview
        run: |
          python3 .github/scripts/package-gpui-ios.py experiments/gpui-mobile-management/target/aarch64-apple-ios/release/xscc-gpui-mobile-management dist-gpui-ios ${{ matrix.package_flags }}
          if [ "${{ matrix.mode }}" = TEST-IP-direct ]; then
            cat dist-gpui-ios/TEST-ONLY.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          cp experiments/gpui-mobile-management/README.md dist-gpui-ios/README.md
          echo 'Native GPUI interactive playback preview: management, software video, direct control or view-only, software-keyboard text and control keys. Foreground audio playback is opt-in per session and initially off; microphone and clipboard are disabled; only limited hardware Enter/Tab is supported, and Wayland non-ASCII is rejected. Unsigned IPA requires your own signing and provisioning. Physical-device launch, authorized connection first-frame rendering and real-device touch gestures and software-keyboard input, audio playback, interruptions and route changes remain unverified.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xscc-gpui-${{ matrix.mode }}-ios26-arm64-unsigned-${{ github.sha }}
          path: dist-gpui-ios/
          if-no-files-found: error
  simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: experiments/gpui-mobile-management
          key: gpui-ios26-management-simulator
          cache-on-failure: true
      - name: Build management-only Simulator application
        working-directory: experiments/gpui-mobile-management
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '26.0'
        run: cargo build --locked --target aarch64-apple-ios-sim --bin xscc-gpui-mobile-management
      - name: Install, launch, capture and relaunch in Simulator
        run: |
          set -o pipefail
          mkdir -p simulator-evidence
          python3 .github/scripts/smoke-gpui-ios-simulator.py experiments/gpui-mobile-management/target/aarch64-apple-ios-sim/debug/xscc-gpui-mobile-management simulator-evidence 2>&1 | tee simulator-evidence/commands.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: xscc-gpui-simulator-evidence-${{ github.sha }}
          path: simulator-evidence/
          if-no-files-found: warn
