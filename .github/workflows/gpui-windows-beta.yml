name: GPUI Windows beta candidates
on:
  push:
    branches: [main, feat/management-prep]
    paths:
      - 'experiments/gpui-validation/**'
      - 'vendor/gpui/**'
      - 'experiments/shared/**'
      - 'src/gpui*'
      - 'src/test_lan.rs'
      - 'src/test_lan/**'
      - 'src/client.rs'
      - 'src/client/**'
      - 'src/ipc.rs'
      - 'src/server.rs'
      - 'src/server/**'
      - 'src/platform/**'
      - 'src/ipc/**'
      - 'src/management/**'
      - 'src/ui_session_interface.rs'
      - 'libs/**'
      - 'crates/**'
      - 'src/host*'
      - 'src/lib.rs'
      - 'src/core_main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/gpui-windows/**'
      - '.github/workflows/gpui-windows-beta.yml'
      - '.github/scripts/*gpui*'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Candidate version, e.g. 0.1.0-beta.3 (does not create a tag or release)'
        required: true
        default: '0.1.0-beta.3'
        type: string
permissions:
  contents: read
concurrency:
  group: gpui-windows-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: controller
            features: live-session
            core_features: use_dasp,gpui-session,hwcodec
          - role: host
            features: native-host
            core_features: use_dasp,gpui-host,hwcodec
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/gpui-${{ matrix.role }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      XSCC_PACKAGE_MODE: managed
      PACKAGE_ROLE: ${{ matrix.role }}
      PACKAGE_VERSION: ${{ inputs.package_version || '0.1.0-beta.3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate candidate label
        run: |
          if ($env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') {
            throw 'Expected a numeric version such as 0.1.0-beta.3'
          }
      - name: Verify beta packager rejects stable versions
        run: |
          $candidateVersion = $env:PACKAGE_VERSION
          try {
            $env:PACKAGE_VERSION = '1.0.0'
            try {
              & ./.github/scripts/package-gpui-windows.ps1
              throw 'Packager accepted a stable version'
            } catch {
              if ($_.Exception.Message -ne 'Invalid candidate version') { throw }
            }
          } finally { $env:PACKAGE_VERSION = $candidateVersion }
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt,clippy
      - name: Set up pinned native codec dependencies
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: true
      - name: Record hosted native toolchain image
        id: native-toolchain
        run: |
          if ($env:ImageVersion -notmatch '^[A-Za-z0-9._-]+$') {
            throw 'Hosted runner image version is unavailable'
          }
          "image_version=$env:ImageVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore native dependency binary archives
        id: native-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-files-v2-Windows-2025-${{ steps.native-toolchain.outputs.image_version }}-x64-windows-static-9e593bb18ea69cc5095e012465dcd675a822ed0d-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}
      - name: Build pinned native dependencies (no driver installation)
        id: native-dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-binary-cache" | Out-Null
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows-static "--x-install-root=$env:VCPKG_ROOT/installed"
          if ($LASTEXITCODE -ne 0) { throw 'Native codec dependency build failed' }
      - name: Save successful native dependency binary archives
        # One writer per matrix; GitHub cache entries are immutable if another run saved first.
        if: matrix.role == 'controller' && steps.native-dependencies.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Configure native binding generator
        run: |
          $clang = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path "$clang/libclang.dll")) { throw 'Runner LLVM/libclang is missing' }
          "LIBCLANG_PATH=$clang" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check formatting
        run: cargo fmt --manifest-path experiments/gpui-validation/Cargo.toml -- --check
      - name: Compile optional Windows VRAM reconfiguration path
        if: matrix.role == 'host'
        run: |
          cargo check --locked --manifest-path Cargo.toml --lib --no-default-features --features use_dasp,gpui-host,hwcodec,vram --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'VRAM reconfiguration compile check failed' }
      - name: Lint Windows preview
        run: cargo clippy --locked --manifest-path experiments/gpui-validation/Cargo.toml --features ${{ matrix.features }} --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Test Windows preview
        run: cargo test --locked --manifest-path experiments/gpui-validation/Cargo.toml --features ${{ matrix.features }} --target x86_64-pc-windows-msvc
      - name: Test native session and host regression coverage
        run: ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }}" -Filter "gpui"
      - name: Test framed transport wire compatibility and blocked-write isolation
        if: matrix.role == 'controller'
        run: cargo test --locked -p hbb_common --lib --target x86_64-pc-windows-msvc tcp::tests
      - name: Test frame-rate-aware codec budget and timestamp duration
        if: matrix.role == 'controller'
        run: |
          cargo test --locked -p scrap --lib --target x86_64-pc-windows-msvc codec::rate_control::tests::
          if ($LASTEXITCODE -ne 0) { throw 'Codec rate-control tests failed' }
          cargo test --locked -p scrap --lib --target x86_64-pc-windows-msvc codec::streaming_tests::
          if ($LASTEXITCODE -ne 0) { throw 'Software codec streaming tests failed' }
      - name: Test video pacing, queue bounds and intentional reconfiguration
        if: matrix.role == 'host'
        run: |
          ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }}" -Filter "server::video_"
          if ($LASTEXITCODE -ne 0) { throw 'Video regression tests failed' }
      - name: Test managed IPC peer authorization
        run: ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }}" -Filter "ipc::ipc_auth::tests"
      - name: Test host management authorization policy
        if: matrix.role == 'host'
        run: ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }}" -Filter "management::host_tests"
      - name: Test native codec probe parser and failure handling
        run: ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }}" -Filter "client::hwcodec::tests"
      - name: Test idle host input unblock is a no-op
        if: matrix.role == 'host'
        run: ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }}" -Filter "server::connection::test::unblock_without_owned_input_block_is_a_noop"
      - name: Compile and test test-only IP role
        run: |
          cargo test --locked --manifest-path experiments/gpui-validation/Cargo.toml --features "${{ matrix.features }},test-lan-direct" --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Test-only IP role tests failed' }
          ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }},test-lan-direct" -Filter "test_lan::"
          if ('${{ matrix.role }}' -eq 'controller') {
            ./.github/scripts/test-gpui-root-filter.ps1 -Features "${{ matrix.core_features }},test-lan-direct" -Filter "gpui_session::tests::test_ip_view_and_interactive_modes_reject_malformed_targets"
          }
      - name: Build standalone release executable
        run: |
          $features = '${{ matrix.features }}'
          cargo build --locked --release --manifest-path experiments/gpui-validation/Cargo.toml --features $features --bin xscc-gpui-validation --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Prepare and verify final application manifest
        run: ./.github/scripts/prepare-gpui-manifest.ps1
      - name: Verify existing elevated runner token for host CLI
        if: matrix.role == 'host'
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Host CLI requires an already elevated runner token; this workflow will not bypass UAC'
          }
      - name: Smoke test release CLI and bounded hardware codec probe
        timeout-minutes: 3
        run: ./.github/scripts/test-gpui-codec-probe.ps1
      - name: Install NSIS compiler
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Assemble unsigned packages and integrity manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: ./.github/scripts/package-gpui-windows.ps1
      - name: Smoke test per-user installer and uninstaller
        if: matrix.role == 'controller'
        run: ./.github/scripts/test-gpui-installer.ps1
      - name: Smoke test host service install and uninstall on disposable runner
        if: matrix.role == 'host'
        timeout-minutes: 5
        run: ./.github/scripts/test-gpui-host-installer.ps1 -ApprovedDisposableRunner
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xscc-${{ matrix.role }}-${{ inputs.package_version || '0.1.0-beta.3' }}-windows11-x86_64-${{ env.XSCC_PACKAGE_MODE }}-unsigned
          path: dist/${{ matrix.role }}/*
          if-no-files-found: error
          retention-days: 30
