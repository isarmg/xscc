syntax = "proto3";
package hbb;

message IdPk {
  string id = 1;
  bytes pk = 2;
  reserved 3;
  // Newest key exchange version the signer speaks; absent, i.e. 0, is the original scheme.
  uint32 kx_version = 4;
}

enum ConnType {
  DEFAULT_CONN = 0;
  FILE_TRANSFER = 1;
  PORT_FORWARD = 2;
  RDP = 3;
  VIEW_CAMERA = 4;
  TERMINAL = 5;
}

message ControlPermissions {
  enum Permission {
    keyboard = 0;
    remote_printer = 1;
    clipboard = 2;
    file = 3;
    audio = 4;
    camera = 5;
    terminal = 6;
    tunnel = 7;
    restart = 8;
    recording = 9;
    block_input = 10;
    remote_modify = 11;
    privacy_mode = 12;
    usb = 13;
  }
  uint64 permissions = 1;
}

message ControlledContext {
  string conn_audit_ref = 1;
}

message PeerDiscovery {
  string cmd = 1;
  string mac = 2;
  string id = 3;
  string username = 4;
  string hostname = 5;
  string platform = 6;
  string misc = 7;
}

// Preserve the LAN discovery envelope and its original field number.
message RendezvousMessage {
  reserved 6 to 21, 23 to 29;
  oneof union {
    PeerDiscovery peer_discovery = 22;
  }
}
