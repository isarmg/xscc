[package]
name = "scrap"
description = "Screen capture made easy."
version = "0.5.0"
repository = "https://github.com/quadrupleslap/scrap"
documentation = "https://docs.rs/scrap"
keywords = ["screen", "capture", "record"]
license = "MIT"
authors = ["Ram <quadrupleslap@gmail.com>"]
edition = "2018"

[features]
# Codec-only consumers leave capture disabled. Hosts choose their platform backend.
capture = ["dep:block", "dep:winapi"]
wayland = ["capture", "gstreamer", "gstreamer-app", "gstreamer-video", "dbus", "tracing", "zbus"]
# `drm` is a pure runtime-dlopen backend: rustdesk loads `libdrmtap.so.0` at runtime (`drmtap_dl.rs`)
# and NEVER link-time links it, so the graceful PipeWire fallback when the .so or EGL is absent is
# preserved. Packaging builds the local DRM capture library without a privileged helper.
# Depends on `wayland`: the three drm modules live inside the `#[cfg(feature = "wayland")]` arm of
# common/mod.rs, so `scrap/drm` on its own would compile nothing. The root crate happens to always
# enable `scrap/wayland`, which is what hid this.
drm = ["wayland", "base/wayland_probe"]
mediacodec = ["ndk"]
linux-pkg-config = ["dep:pkg-config"]
hwcodec = ["dep:hwcodec"]
vram = ["hwcodec/vram"]

[dependencies]
cfg-if = "1.0"
num_cpus = "1.15"
lazy_static = "1.4"
hbb_common = { path = "../hbb_common" }
base = { path = "../base" }
serde = {version="1.0", features=["derive"]}

[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3"
optional = true
default-features = true
features = ["dxgi", "dxgi1_2", "dxgi1_5", "dxgi1_6", "d3d11", "winuser", "winerror", "errhandlingapi", "libloaderapi"]

[target.'cfg(target_os = "macos")'.dependencies]
block = { version = "0.1", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "objc2-io-surface"] }
objc2-io-surface = { version = "=0.3.2", default-features = false, features = ["objc2-core-foundation"] }
objc2-video-toolbox = { version = "=0.3.2", default-features = false, features = ["std", "bitflags", "VTBase", "VTDecompressionSession", "VTDecompressionProperties", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
jni = "0.21"
lazy_static = "1.4"
log = "0.4"
serde_json = "1.0"
ndk = { version = "0.7", features = ["media", "api-level-29"], optional = true}
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
repng = "0.2"
docopt = "1.1"
quest = "0.3"

[build-dependencies]
bindgen = "0.72.1"
pkg-config = { version = "0.3.27", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }
tracing = { version = "0.1", optional = true }
gstreamer = { version = "0.16", optional = true }
gstreamer-app = { version = "0.16", features = ["v1_10"], optional = true }
gstreamer-video = { version = "0.16", optional = true }
zbus = { version = "3.15", optional = true }

[dependencies.hwcodec]
package = "hardware-video-codecs"
path = "../hardware-video-codecs"
optional = true

[[example]]
name = "benchmark"
required-features = ["capture"]

[[example]]
name = "capture_mag"
required-features = ["capture"]

[[example]]
name = "ffplay"
required-features = ["capture"]

[[example]]
name = "list"
required-features = ["capture"]

[[example]]
name = "screenshot"
required-features = ["capture"]
