[package]
name = "xcss-web-build"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Auditable Rust-only asset builder and Axum development server for xcss-web CSR"

[workspace]

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
flate2 = "=1.1.10"
percent-encoding = "=2.3.2"
oxc = { version = "=0.153.0", features = ["ast_visit", "codegen", "minifier", "semantic"] }
lightningcss = { version = "=1.0.0-alpha.71", default-features = false, features = ["visitor"] }
# 0.28.3 changed cssparser's public type version in a patch release, which
# breaks Lightning CSS alpha.71's 0.33 types. Keep the compatible release exact.
parcel_selectors = "=0.28.2"
memchr = "2"
mime_guess = "=2.0.5"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.8.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[lints.rust]
unsafe_code = "forbid"
