# Cross-compilation configuration for One-KVM
# Build containers compile native Linux binaries; they are not deployment images.
# See: https://github.com/cross-rs/cross

[build]
# Default native target
default-target = "x86_64-unknown-linux-gnu"

[target.x86_64-unknown-linux-gnu]
dockerfile = { file = "one-kvm/build/cross/Dockerfile.x86_64", context = "one-kvm" }

[target.aarch64-unknown-linux-gnu]
dockerfile = { file = "one-kvm/build/cross/Dockerfile.arm64", context = "one-kvm" }

[target.armv7-unknown-linux-gnueabihf]
dockerfile = { file = "one-kvm/build/cross/Dockerfile.armv7", context = "one-kvm" }
