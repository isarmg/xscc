[package]
name = "one-kvm-web"
version = "0.2.8"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[workspace]
exclude = ["vendor/xcss-web"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xcss-web = { path = "vendor/xcss-web", default-features = false, features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "History", "Event", "EventTarget", "SubmitEvent", "HtmlInputElement", "HtmlTextAreaElement", "HtmlFormElement", "HtmlSelectElement", "FormData", "AbortController", "AbortSignal", "Crypto", "KeyboardEvent", "MouseEvent", "WheelEvent", "HtmlImageElement", "HtmlVideoElement", "DomRect", "File", "FileList", "MessageEvent"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
