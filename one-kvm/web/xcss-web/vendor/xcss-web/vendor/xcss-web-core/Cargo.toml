# Dependency versions mirror the published 0.8.19 manifest.
# This keeps this isolated CSR experiment on each application lockfile instead
# of selecting the older sibling crate versions in the upstream workspace.

[package]
edition = "2021"
rust-version = "1.88"
name = "xcss-web-core"
version = "0.8.19"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Internal xcss-web browser CSR runtime"
readme = "README.md"
license = "MIT"

[package.metadata.cargo-all-features]
denylist = [
    "tracing",
    "template_macro",
    "rustls",
    "default-tls",
    "wasm-bindgen",
    "rkyv",
    "trace-component-props",
    "spin",
    "islands",
    "bitcode",
    "bitcode-serde",
    "serde-lite",
    "cbor",
    "msgpack",
    "postcard",
    "multipart",
]
skip_feature_sets = [
    [
    "csr",
    "ssr",
],
    [
    "csr",
    "hydrate",
],
    [
    "ssr",
    "hydrate",
],
    [
    "serde",
    "serde-lite",
],
    [
    "serde",
    "miniserde",
],
    [
    "serde",
    "rkyv",
],
    [
    "miniserde",
    "rkyv",
],
    [
    "serde-lite",
    "rkyv",
],
    [
    "default-tls",
    "rustls",
],
]
max_combination_size = 2

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--generate-link-to-definition",
    "--cfg",
    "erase_components",
]

[features]
# Browser builds use CSR; optional historical APIs remain gated.
default = ["csr"]
full = [
    "any_spawner/futures-executor",
    "dep:hydration_context",
    "dep:leptos_config",
    "dep:leptos_hot_reload",
    "dep:leptos_server",
    "dep:serde_qs",
    "dep:server_fn",
    "xcss_web_macro/full",
    "reactive_graph/hydration",
    "shadow-dom",
    "tachys/reactive_stores",
]
bitcode = ["full", "server_fn/bitcode"]
bitcode-serde = ["full", "server_fn/bitcode-serde"]
cbor = ["full", "server_fn/cbor"]
csr = [
    "xcss_web_macro/csr",
    "reactive_graph/effects",
    "getrandom?/wasm_js",
]
default-tls = ["full", "server_fn/default-tls"]
delegation = ["tachys/delegation"]
hydrate = [
    "full",
    "xcss_web_macro/hydrate",
    "hydration",
    "tachys/hydrate",
    "reactive_graph/effects",
    "getrandom?/wasm_js",
]
hydration = [
    "full",
    "reactive_graph/hydration",
    "leptos_server/hydration",
    "hydration_context/browser",
    "leptos_dom/hydration",
]
islands = ["full", "xcss_web_macro/islands"]
islands-router = ["tachys/mark_branches"]
msgpack = ["full", "server_fn/msgpack"]
multipart = ["full", "server_fn/multipart"]
nightly = [
    "xcss_web_macro/nightly",
    "reactive_graph/nightly",
    "tachys/nightly",
]
nonce = [
    "base64",
    "rand",
    "dep:getrandom",
]
postcard = ["full", "server_fn/postcard"]
rkyv = [
    "full",
    "server_fn/rkyv",
    "leptos_server/rkyv",
]
rustls = ["full", "server_fn/rustls"]
serde-lite = [
    "full",
    "server_fn/serde-lite",
    "leptos_server/serde-lite",
]
shadow-dom = [
    "web-sys/ShadowRoot",
    "web-sys/ShadowRootInit",
    "web-sys/ShadowRootMode",
]
spin = ["leptos-spin-macro"]
ssr = [
    "full",
    "xcss_web_macro/ssr",
    "leptos_server/ssr",
    "server_fn/ssr",
    "hydration",
    "tachys/ssr",
]
subsecond = [
    "reactive_graph/subsecond",
    "dep:subsecond",
    "dep:dioxus-cli-config",
    "dep:dioxus-devtools",
    "web-sys/Location",
    "web-sys/MessageEvent",
    "web-sys/WebSocket",
    "web-sys/Window",
]
trace-component-props = [
    "xcss_web_macro/trace-component-props",
    "leptos_dom/trace-component-props",
]
tracing = [
    "dep:tracing",
    "reactive_graph/tracing",
    "tachys/tracing",
    "xcss_web_macro/tracing",
    "leptos_dom/tracing",
    "leptos_server?/tracing",
]

[lib]
name = "xcss_web_core"
path = "src/lib.rs"

[[test]]
name = "pr_4061"
path = "tests/pr_4061.rs"

[[test]]
name = "ssr"
path = "tests/ssr.rs"

[dependencies.any_spawner]
version = "0.3.0"
features = ["wasm-bindgen"]

[dependencies.base64]
version = "0.22"
optional = true
default-features = true

[dependencies.cfg-if]
version = "1.0"
default-features = true

[dependencies.dioxus-cli-config]
version = "0.7"
optional = true
default-features = true

[dependencies.dioxus-devtools]
version = "0.7"
optional = true
default-features = true

[dependencies.either_of]
version = "0.1.9"

[dependencies.futures]
version = "0.3"
default-features = true

[dependencies.getrandom]
version = "0.4"
optional = true
default-features = true

[dependencies.hydration_context]
optional = true
version = "0.3.0"

[dependencies.leptos-spin-macro]
version = "0.2"
optional = true
default-features = true

[dependencies.leptos_config]
optional = true
version = "0.8.10"

[dependencies.leptos_dom]
version = "0.8.8"

[dependencies.leptos_hot_reload]
optional = true
version = "0.8.6"

[dependencies.xcss_web_macro]
package = "xcss-web-macro"
path = "../xcss-web-macro"
version = "0.8.19"
default-features = false

[dependencies.leptos_server]
optional = true
version = "0.8.7"
features = ["tachys"]

[dependencies.oco_ref]
version = "0.2.1"

[dependencies.or_poisoned]
version = "0.1.0"

[dependencies.paste]
version = "1.0"
default-features = true

[dependencies.rand]
version = "0.9"
optional = true
default-features = true

[dependencies.reactive_graph]
version = "0.2.14"
features = ["serde"]

[dependencies.rustc-hash]
version = "2.1"
default-features = true

[dependencies.send_wrapper]
version = "0.6"
default-features = true

[dependencies.serde]
version = "1.0"
default-features = true

[dependencies.serde_json]
version = "1.0"
default-features = true

[dependencies.serde_qs]
optional = true
version = "0.15"
default-features = true

[dependencies.server_fn]
optional = true
version = "0.8.12"
features = [
    "form-redirects",
    "browser",
]

[dependencies.slotmap]
version = "1.1"
default-features = true

[dependencies.subsecond]
version = "0.7"
optional = true
default-features = true

[dependencies.tachys]
version = "0.2.15"
features = [
    "reactive_graph",
    "oco",
]

[dependencies.thiserror]
version = "2.0"
default-features = true

[dependencies.throw_error]
version = "0.3.1"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = true

[dependencies.typed-builder]
version = "0.23"
default-features = true

[dependencies.typed-builder-macro]
version = "0.23"
default-features = true

[dependencies.wasm-bindgen]
version = "0.2"
default-features = true

[dependencies.wasm-bindgen-futures]
version = "0.4"
default-features = true

[dependencies.wasm_split_helpers]
version = "0.2.1"
default-features = true

[dependencies.web-sys]
version = "0.3"
default-features = true

[dev-dependencies.any_spawner]
version = "0.3.0"
features = [
    "futures-executor",
    "tokio",
]

[dev-dependencies.tokio]
version = "1.49"
features = [
    "rt-multi-thread",
    "macros",
]
default-features = true

[dev-dependencies.tokio-test]
version = "0.4"
default-features = true

[build-dependencies.rustc_version]
version = "0.4"
default-features = true

[target."cfg(erase_components)".dependencies.xcss_web_macro]
package = "xcss-web-macro"
path = "../xcss-web-macro"
version = "0.8.19"
default-features = false
features = ["__internal_erase_components"]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(leptos_debuginfo)",
    "cfg(rustc_nightly)",
]
