[package]
name = "video-codec-backends"
version = "0.8.0"
edition = "2021"
description = "Hardware video codec for IP-KVM (Windows/Linux)"
# This crate contains code derived from RustDesk hwcodec (AGPL-3.0).
# See NOTICE in this directory and the LICENSE file in the repository root.
license = "AGPL-3.0-only"

[package.metadata.cargo-machete]
ignored = ["serde"]

[features]
default = []
bytes = ["dep:bytes"]
rkmpp = []

[dependencies]
log = "0.4"
bytes = { version = "1", optional = true }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
linux-video-device = { path = "../linux-video-device" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[build-dependencies]
cc = "1.0"
bindgen = "0.72"
