[package]
name = "virtual-display-driver"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
roxmltree = "=0.20.0"

[build-dependencies]
bindgen = { version = "=0.72.1", default-features = false, features = ["runtime"] }

[profile.release]
panic = "abort"
debug = true
