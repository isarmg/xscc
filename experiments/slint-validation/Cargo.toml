[package]
name = "xscc-slint-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
xscc-codec = ["dep:scrap"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30"] }
base = { path = "../../libs/base" }
xscc = { path = "../../crates/management" }
xscc-native-management = { path = "../../crates/native-management" }
async-trait = "0.1"
tokio = { version = "~1.53.2", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protobuf = "3.7"
image = { version = "0.25", default-features = false, features = ["png"] }
# libc 0.2.190 hides dyld declarations on iOS while backtrace still uses them.
libc = "=0.2.189"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
scrap = { path = "../../libs/scrap", optional = true, features = ["linux-pkg-config"] }

[patch.crates-io]
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }

[profile.dev]
debug = 0
