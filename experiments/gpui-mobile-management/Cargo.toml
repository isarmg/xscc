[package]
name = "xscc-gpui-mobile-management"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "xscc_gpui_android_management"
path = "src/android.rs"
crate-type = ["cdylib"]

[workspace]

[features]
default = ["mobile-management"]
mobile-management = []
mobile-session = ["dep:librustdesk", "dep:image", "dep:base"]
# This compatibility feature enables shared appearance only, never media.
live-session = []

[dependencies]
gpui = { package = "gpui_platform", path = "../../vendor/gpui/crates/gpui_platform", default-features = false, features = ["font-kit"] }
xscc = { path = "../../crates/management" }
xscc-native-management = { path = "../../crates/native-management" }
async-trait = "0.1"
tokio = { version = "~1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
unicode-segmentation = "1.12"
# Match the validated iOS framework dependency while backtrace uses dyld declarations.
libc = "=0.2.189"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
base = { path = "../../libs/base", optional = true }
librustdesk = { package = "rustdesk", path = "../..", default-features = false, features = ["use_dasp", "gpui-mobile-session"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileManager", "NSPathUtilities", "NSString", "NSURL", "NSError"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "=0.13.3"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }

[profile.dev]
debug = 0
