[package]
name = "xscc-gpui-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[features]
mobile-management = []
live-session = ["dep:librustdesk", "librustdesk/hwcodec"]
native-host = ["live-session", "librustdesk/gpui-host"]
native-host-vram = ["native-host", "librustdesk/vram"]
xscc-codec = ["dep:scrap"]
test-lan-direct = ["live-session", "librustdesk/test-lan-direct"]

[dependencies]
gpui = { package = "gpui_platform", path = "../../vendor/gpui/crates/gpui_platform", default-features = false, features = ["font-kit", "wayland"] }
base = { path = "../../libs/base" }
xscc = { path = "../../crates/management" }
xscc-native-management = { path = "../../crates/native-management" }
async-trait = "0.1"
tokio = { version = "~1.53.2", features = ["rt-multi-thread", "sync", "time"] }
serde_json = "1"
unicode-segmentation = "1.12"
protobuf = "3.7"
image = { version = "0.25", default-features = false, features = ["png"] }
# libc 0.2.190 hides dyld declarations on iOS while backtrace still uses them.
libc = "=0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
librustdesk = { package = "rustdesk", path = "../..", default-features = false, features = ["use_dasp", "gpui-session"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
librustdesk = { package = "rustdesk", path = "../..", default-features = false, features = ["use_dasp", "gpui-session"], optional = true }
scrap = { path = "../../libs/scrap", optional = true, features = ["linux-pkg-config"] }

[target.'cfg(target_os = "macos")'.dependencies]
librustdesk = { package = "rustdesk", path = "../..", default-features = false, features = ["use_dasp", "gpui-session", "screencapturekit"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }


[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
