plugins {
    id 'com.android.application'
}

configurations {
    gameActivityOriginal {
        canBeConsumed = false
        transitive = false
    }
}

def filteredGameActivity = layout.buildDirectory.file('privacy/game-activity-4.4.0.aar')
def prepareGameActivity = tasks.register('prepareGameActivity', Exec) {
    inputs.files(configurations.gameActivityOriginal)
    inputs.file(rootProject.file('../../.github/scripts/prepare-gpui-game-activity.py'))
    outputs.file(filteredGameActivity)
    doFirst {
        commandLine 'python3', rootProject.file('../../.github/scripts/prepare-gpui-game-activity.py'),
            configurations.gameActivityOriginal.singleFile, filteredGameActivity.get().asFile
    }
}

android {
    sourceSets.main.java.srcDir '../vendor/game-text-input/src/main/java'
    namespace 'org.xscc.gpui.smoke'
    compileSdk 36

    defaultConfig {
        applicationId 'org.xscc.gpui.smoke'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1-smoke'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'privacy-rules.pro'
            optimization {
                keepRules {
                    ignoreFrom 'androidx.annotation:annotation', 'androidx.annotation:annotation-jvm'
                }
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    gameActivityOriginal 'androidx.games:games-activity:4.4.0@aar'
    implementation files(filteredGameActivity).builtBy(prepareGameActivity)
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.13.0'
}

// An unoptimized variant would retain upstream GameTextInput plaintext logs.
androidComponents {
    beforeVariants(selector().withBuildType('debug')) { variant ->
        variant.enable = false
    }
}
