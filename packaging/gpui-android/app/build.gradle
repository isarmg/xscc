plugins {
    id 'com.android.application'
}

configurations {
    gameActivityOriginal {
        canBeConsumed = false
        transitive = false
    }
}

def filteredGameActivity = layout.buildDirectory.file('privacy/game-activity-4.4.0.aar')
def prepareGameActivity = tasks.register('prepareGameActivity', Exec) {
    inputs.files(configurations.gameActivityOriginal)
    inputs.file(rootProject.file('../../.github/scripts/prepare-gpui-game-activity.py'))
    outputs.file(filteredGameActivity)
    doFirst {
        commandLine 'python3', rootProject.file('../../.github/scripts/prepare-gpui-game-activity.py'),
            configurations.gameActivityOriginal.singleFile, filteredGameActivity.get().asFile
    }
}

android {
    sourceSets.main.java.srcDir '../vendor/game-text-input/src/main/java'
    namespace 'org.xscc.gpui.smoke'
    compileSdk 36
    buildFeatures {
        buildConfig = true
    }
    flavorDimensions 'client'
    productFlavors {
        smoke {
            dimension 'client'
            applicationId 'org.xscc.gpui.smoke'
            buildConfigField 'String', 'NATIVE_LIBRARY', '"xscc_gpui_android_smoke"'
            manifestPlaceholders = [nativeLibrary: 'xscc_gpui_android_smoke', appLabel: 'XSCC GPUI Smoke']
        }
        management {
            dimension 'client'
            applicationId 'org.sarmg.xscc.gpui.preview'
            versionCode 9
            versionName '0.1.0-beta.9'
            buildConfigField 'String', 'NATIVE_LIBRARY', '"xscc_gpui_android_management"'
            manifestPlaceholders = [nativeLibrary: 'xscc_gpui_android_management', appLabel: 'XSCC 控制端预览']
        }
        landirect {
            dimension 'client'
            applicationId 'org.sarmg.xscc.gpui.testdirect'
            buildConfigField 'String', 'NATIVE_LIBRARY', '"xscc_gpui_android_management"'
            manifestPlaceholders = [nativeLibrary: 'xscc_gpui_android_management', appLabel: 'XSCC TEST IP']
        }
    }

    defaultConfig {
        applicationId 'org.xscc.gpui.smoke'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1-smoke'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (System.getenv('XSCC_ANDROID_PREVIEW_KEYSTORE')) {
            previewRelease {
                storeFile file(System.getenv('XSCC_ANDROID_PREVIEW_KEYSTORE'))
                storePassword System.getenv('XSCC_ANDROID_PREVIEW_PASSWORD')
                keyAlias 'xscc-preview'
                keyPassword System.getenv('XSCC_ANDROID_PREVIEW_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig(
                System.getenv('XSCC_ANDROID_PREVIEW_KEYSTORE')
                    ? signingConfigs.previewRelease : signingConfigs.debug
            )
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'privacy-rules.pro'
            optimization {
                keepRules {
                    ignoreFrom 'androidx.annotation:annotation', 'androidx.annotation:annotation-jvm'
                }
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    gameActivityOriginal 'androidx.games:games-activity:4.4.0@aar'
    implementation files(filteredGameActivity).builtBy(prepareGameActivity)
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.13.0'
}

// An unoptimized variant would retain upstream GameTextInput plaintext logs.
androidComponents {
    beforeVariants(selector().withBuildType('debug')) { variant ->
        variant.enable = false
    }
}
